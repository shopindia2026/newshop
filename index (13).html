<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{--ink:#211b2e;--mut:#81798d;--p:#6d28d9;--pale:#f5f1fc;--line:#eee9f4}
*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{height:66px;background:#fffffff2;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 max(4vw,14px);position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:20px;white-space:nowrap}.brand b{color:var(--p)}
#q{flex:1;min-width:0;max-width:520px;margin:0 auto 0 0;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#f7f5fa}
.nav{display:flex;gap:14px;font-weight:700;font-size:14px;align-items:center}.nav b{background:var(--p);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px}
main{max-width:1100px;margin:auto;padding:20px 14px 80px}
.hero{border-radius:22px;background:linear-gradient(115deg,#4c1d95,#7c3aed 60%,#a78bfa);color:#fff;padding:38px 6%;margin-bottom:8px}
.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.1;margin:0 0 8px;letter-spacing:-1.5px}.hero p{margin:0 0 16px;color:#eee5ff}
.banner{border-radius:14px;padding:12px;text-align:center;font-weight:800;color:#fff;background:linear-gradient(90deg,#b45309,#f59e0b);margin-bottom:12px}
h2{font-size:22px;margin:24px 0 12px}h3{margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer}
.card .im{aspect-ratio:1;background:var(--pale);display:grid;place-items:center;font-size:48px;position:relative}.card img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;left:8px;background:#16a34a;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.card .in{padding:10px 12px 12px}.card h4{margin:0 0 4px;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:800;font-size:17px}.old{text-decoration:line-through;color:#aaa1b2;font-size:12px;margin-left:6px;font-weight:400}.mut{color:var(--mut);font-size:13px}
.btn{display:inline-block;border:0;background:var(--p);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;text-align:center}
.btn.g{background:#fff;color:var(--p);border:1px solid #ddd0f3}.btn.d{background:#dc2626}.btn.s{padding:7px 11px;font-size:13px}.btn.w{width:100%;margin-top:10px}.btn:disabled{opacity:.5}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:#7d7589}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd6e6;border-radius:10px;margin:4px 0 12px;background:#fbfaff;display:block}
input:focus,select:focus,textarea:focus{outline:2px solid #c4b5fd}input[type=checkbox]{width:auto;display:inline;margin:0 6px 0 0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:640px){.f2{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}@media(max-width:700px){.two{grid-template-columns:1fr;gap:14px}}
.main{width:100%;max-height:440px;object-fit:contain;border-radius:12px;background:#fff;cursor:zoom-in;display:block}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.th img{width:62px;height:62px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}.th img.on{border-color:var(--p)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row img{width:54px;height:54px;object-fit:cover;border-radius:8px}
.st{display:inline-block;border-radius:99px;background:#fff3d7;color:#8a5b00;padding:3px 10px;font-size:12px;font-weight:800}.st.Confirmed,.st.Delivered,.st.Shipped{background:#dcfce7;color:#166534}.st.Rejected,.st.Cancelled{background:#fee2e2;color:#991b1b}
.steps{display:flex;gap:6px;margin-bottom:12px}.steps span{flex:1;text-align:center;font-size:13px;padding:7px;border-radius:99px;background:#eee9f4;color:#7d7589;font-weight:600}.steps .on{background:var(--p);color:#fff}.steps .ok{background:#dcfce7;color:#166534}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.amt{font-size:34px;font-weight:800;color:var(--p);text-align:center}
.zoom{position:fixed;inset:0;background:#000e;z-index:300;overflow:auto;padding:46px 8px}.zoom img{width:150%;max-width:none;display:block;margin:auto}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#241a31;color:#fff;padding:11px 18px;border-radius:10px;z-index:400}
.bn{display:none}@media(max-width:700px){.bn{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}.bn a{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--mut)}.nav .hide{display:none}}

@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes gr{0%{background-position:0 50%}100%{background-position:200% 50%}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes drw{to{stroke-dashoffset:0}}
@keyframes sh{0%{left:-60%}60%,100%{left:130%}}
@keyframes tin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
#app>*{animation:up .5s ease both}#app>*:nth-child(2){animation-delay:.08s}#app>*:nth-child(3){animation-delay:.16s}#app>*:nth-child(4){animation-delay:.24s}
.hero{background-size:200% 200%;animation:gr 8s linear infinite alternate}
.main{animation:flt 4.5s ease-in-out infinite}.tag{animation:pls 1.6s ease-in-out infinite}
.off{display:inline-block;background:#dc2626;color:#fff;font-weight:800;font-size:13px;padding:5px 12px;border-radius:99px;animation:pls 1.4s ease-in-out infinite}
.card{transition:transform .2s,box-shadow .2s;animation:up .5s ease both}.card:hover{transform:translateY(-5px);box-shadow:0 12px 28px #34204b1a}.card:active{transform:scale(.98)}
.btn{transition:transform .15s,filter .15s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.shine{position:relative;overflow:hidden}.btn.shine::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:sh 2.8s ease-in-out infinite}
.th img{transition:transform .15s}.th img:hover{transform:scale(1.1)}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}.shake{animation:shk .4s}
.tick circle,.tick path{stroke-dasharray:160;stroke-dashoffset:160;animation:drw .7s ease forwards}.tick path{animation-delay:.35s}
.toast{animation:tin .3s ease both}.steps .on{animation:pls 1.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

 return `${settings.banner?`<div class="banner">${esc(settings.banner)}</div>`:''}<section class="hero"><h1>${esc(settings.storeName)}</h1><p>Apni pasand ke products ghar baithe order karein. Payment UPI se.</p></section>
 <h2>Products</h2><div class="grid">${l.map(card).join('')||'<p class="mut">Abhi koi product nahi.</p>'}</div>`}

let curP=null;

 return `${products.length>1?'<a href="#home" class="mut">← Wapas</a>':''}<div class="two" style="margin-top:10px"><div>${ph[0]?`<img class="main" id="mp" data-a="zoom" src="${ph[0]}" alt="">`:'<div class="panel" style="text-align:center;font-size:60px">🛍️</div>'}<div class="th">${ph.map((z,i)=>`<img data-a="thumb" data-i="${i}" src="${z}" alt="" class="${i?'':'on'}">`).join('')}</div></div>
 <div>${p.discount>0?`<span class="off">🔥 ${p.discount}% OFF · Limited deal</span>`:''}<h1 style="font-size:24px;margin:8px 0">${esc(p.title)}</h1><span class="pr" style="font-size:24px">${money(price(p))}</span>${p.discount>0?`<span class="old">${money(p.price)}</span> <span class="mut">${p.discount}% off</span>`:''}
 <p style="white-space:pre-wrap;line-height:1.6">${esc(p.description)}</p>${(p.sizes||[]).length?`<label>Size<select id="sz">${p.sizes.map(z=>`<option>${esc(z)}</option>`).join('')}</select></label>`:''}
 <button class="btn w shine" data-a="add" data-id="${esc(p.id)}">Cart mein daalein</button><button class="btn g w" data-a="buy" data-id="${esc(p.id)}">Abhi kharidein</button></div></div>`}

function cartV(){cart=cart.filter(c=>products.some(p=>p.id===c.id));sv('cart',cart);cc();if(!cart.length)return '<h2>Cart khali hai</h2><a class="btn" href="#home">Shopping karein</a>';
 let t=0;return `<h2>Cart</h2><div class="panel">${cart.map((c,i)=>{const p=products.find(x=>x.id===c.id);t+=price(p)*c.qty;return `<div class="row"><div><b>${esc(p.title)}</b>${c.size?` <span class="mut">(${esc(c.size)})</span>`:''}<div class="mut">${money(price(p))}</div></div><div><button class="btn g s" data-a="qty" data-i="${i}" data-d="-1">−</button> ${c.qty} <button class="btn g s" data-a="qty" data-i="${i}" data-d="1">+</button> <button class="btn d s" data-a="rm" data-i="${i}">Hatayein</button></div></div>`}).join('')}<h3 style="margin-top:14px">Total: ${money(t)}</h3><a class="btn" href="#checkout">Checkout</a></div>`}
const total=()=>cart.reduce((s,c)=>{const p=products.find(x=>x.id===c.id);return s+(p?price(p)*c.qty:0)},0);

function checkout(){if(!cart.length)return '<p>Cart khali hai. <a href="#home"><b>Shopping karein</b></a></p>';
 return `<div class="steps"><span class="ok">1 Cart</span><span class="on">2 Address</span><span>3 Payment</span></div><form class="panel" id="co"><h3>Delivery address</h3><div class="f2"><label>Naam<input name="name" required></label><label>Mobile<input name="phone" type="tel" pattern="[0-9]{10}" maxlength="10" required></label><label>Pincode<input name="pincode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><label>City<input name="city" required></label></div><label>State<input name="state" required></label><label>Pura address<textarea name="address" rows="3" required></textarea></label><button class="btn w">Order karein · ${money(total())}</button><p class="mut">Order ke baad payment ka QR dikhega.</p></form>`}

function pay(){const o=LS('last',null);if(!o)return '<p>Koi order nahi. <a href="#home"><b>Shopping karein</b></a></p>';
 const upi=(settings.upiId||DEFAULT_UPI).trim(),link=`upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(settings.storeName)}&am=${o.total}&cu=INR&tn=${encodeURIComponent('Order '+o.short)}`;
 return `<div class="steps"><span class="ok">1 Cart</span><span class="ok">2 Address</span><span class="on">3 Payment</span></div>
 <div class="panel pop" style="max-width:480px;margin:auto;text-align:center"><p class="mut" style="margin:0">Order ID: <b>${esc(o.short)}</b></p><div class="amt">${money(o.total)}</div><p class="mut" style="margin:0 0 6px">Itni hi rakam bhejein</p>
 <img src="${esc(settings.qr||DEFAULT_QR)}" alt="UPI QR code" style="width:300px;max-width:100%;display:block;margin:6px auto">

 b.innerHTML=l.map(o=>{const rej=o.status==='Rejected'||o.status==='Cancelled',si=STEPS.indexOf(o.status),t=o.tracking;

  return `<div class="panel"><b>#${o.id.slice(-6).toUpperCase()}</b> <span class="mut">${fmt(o.createdAt)}</span>${tl}${w}${tr}<p class="mut">${(o.lines||[]).map(x=>esc(x.title.slice(0,50))+' × '+x.qty).join(', ')}<br>Total ${money(o.total)} · Payment: ${esc(o.paymentStatus)}${o.utr?' · UTR '+esc(o.utr):''}<br>Delivery: ${esc(o.address)}, ${esc(o.city)} - ${esc(o.pincode)}</p>${h?`<details><summary><b>Tracking history</b></summary>${h}</details>`:''}${o.paymentStatus==='Unpaid'?`<form data-oid="${o.id}" class="utr2"><input name="utr" placeholder="12 ank ka UTR" pattern="[0-9]{12}" maxlength="12" required><button class="btn s">UTR daalein</button></form>`:''}</div>`}).join('')||'<p class="mut">Abhi koi order nahi.</p>'}

 return `<h2>Admin Panel</h2><div class="tabs">${t('products','Products')}${t('offers','Offers')}${t('orders','Orders')}${t('settings','Settings')}<button class="btn d" data-a="logout">Logout</button></div><div id="ab"></div>`}

let editId=null,editPh=[],adminOrders=[];
const seedBox=()=>dbp.length?'':`<div class="panel"><b>Product abhi sirf site par dikh raha hai.</b><p class="mut">Edit aur offer ke liye pehle ise Firebase me save karein.</p><button class="btn" data-a="seed">Product Firebase me save karein</button></div>`;
function drawPh(){$('#eph').innerHTML=editPh.map((z,i)=>`<div style="position:relative"><img src="${z}" alt="" style="width:78px;height:78px;object-fit:cover;border-radius:8px;display:block"><button type="button" class="btn d s" data-a="pdel" data-i="${i}" style="position:absolute;top:2px;right:2px;padding:1px 7px">×</button>${i?`<button type="button" class="btn s" data-a="pmain" data-i="${i}" style="position:absolute;bottom:2px;left:2px;padding:1px 6px;font-size:11px">Main</button>`:'<span class="tag" style="top:2px;left:2px">Main</span>'}</div>`).join('')}
function drawEdit(){const p=dbp.find(x=>x.id===editId);if(!p){editId=null;return loadAdmin()}editPh=[...(p.photos||[])];
 $('#ab').innerHTML=`<form class="panel pop" id="ef"><h3>Product edit karein</h3><div class="f2"><label>Naam<input name="title" required value="${esc(p.title)}"></label><label>MRP price (₹)<input name="price" type="number" min="1" required value="${p.price}"></label><label>Offer / Discount %<input name="discount" type="number" min="0" max="99" value="${p.discount||0}"></label><label>Sizes (khali = nahi)<input name="sizes" value="${esc((p.sizes||[]).join(','))}"></label></div><label>Description<textarea name="description" rows="6" required>${esc(p.description)}</textarea></label><label>Photos (max 9). × se hatayein, "Main" se pehli photo banayein</label><div id="eph" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"></div><label>Nayi photos jodein<input name="ph" type="file" accept="image/*" multiple></label><button class="btn">Badlav save karein</button> <button type="button" class="btn g" data-a="cancel">Wapas</button></form>`;drawPh()}
async function loadAdmin(){const b=$('#ab');if(!b)return;
 if(editId){drawEdit();return}
 if(tab==='offers'){b.innerHTML=seedBox()+`<form class="panel" id="of"><h3>Offer banner aur extra discount</h3><label>Offer banner (site par upar dikhega, khali = band)<input name="banner" value="${esc(settings.banner||'')}" placeholder="🔥 Diwali Sale - Limited time!"></label><label>Sab products par extra discount % (0 = koi nahi)<input name="globalDiscount" type="number" min="0" max="90" value="${Number(settings.globalDiscount||0)}"></label><button class="btn">Offer save karein</button></form><h3>Product ka offer</h3>`+dbp.map(p=>`<div class="panel"><b>${esc(p.title.slice(0,70))}</b><p class="mut">MRP ${money(p.price)} · abhi price ${money(price(p))}</p><div style="display:flex;gap:8px;align-items:center"><input id="od-${p.id}" type="number" min="0" max="99" value="${p.discount||0}" style="margin:0;max-width:110px"><span>% off</span><button class="btn s" data-a="odisc" data-id="${p.id}">Save</button></div></div>`).join('');return}
 if(tab==='products')b.innerHTML=(dbp.length?'':`<div class="panel"><b>Realme Buds product abhi sirf site par dikh raha hai.</b><p class="mut">Isse Firebase me save karein taaki yahin se price/photos badal sakein.</p><button class="btn" data-a="seed">Product Firebase me save karein</button></div>`)+`<form class="panel" id="pf"><h3>Naya product</h3><div class="f2"><label>Naam<input name="title" required></label><label>Price (₹)<input name="price" type="number" min="1" required></label><label>Discount %<input name="discount" type="number" min="0" max="99" value="0"></label><label>Sizes (S,M,L - nahi to khali)<input name="sizes"></label></div><label>Description<textarea name="description" rows="3" required></textarea></label><label>Photos (8-9 tak)<input name="ph" type="file" accept="image/*" multiple></label><button class="btn">Product save karein</button></form><h3>Saare products (${dbp.length})</h3>`+dbp.map(p=>`<div class="row"><div style="display:flex;gap:10px;align-items:center">${(p.photos||[])[0]?`<img src="${p.photos[0]}" alt="">`:''}<div><b>${esc(p.title)}</b><div class="mut">${money(price(p))} · ${(p.photos||[]).length} photos</div></div></div><div><button class="btn g s" data-a="editp" data-id="${esc(p.id)}">Edit</button> <button class="btn d s" data-a="delp" data-id="${esc(p.id)}">Delete</button></div></div>`).join('');
 else if(tab==='orders'){const s=await getDocs(collection(db,'orders'));const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);adminOrders=l;const cnt={};l.forEach(o=>{if(o.utr)cnt[o.utr]=(cnt[o.utr]||0)+1});
  b.innerHTML=l.map(o=>{const dup=o.utr&&cnt[o.utr]>1,old=o.status==='Pending'&&Date.now()-o.createdAt>864e5,t=o.tracking||{};
  return `<div class="panel"><b>#${o.id.slice(-6).toUpperCase()}</b> <span class="st ${esc(o.status)}">${esc(o.status)}</span> <span class="mut">${esc(o.paymentStatus)} · ${fmt(o.createdAt)}</span>${dup?' <span class="st Rejected">⚠ Duplicate UTR</span>':''}${old?' <span class="st">24h+ pending</span>':''}<p>${esc(o.name)} · ${esc(o.phone)}<br>${esc(o.address)}, ${esc(o.city)}, ${esc(o.state)} - ${esc(o.pincode)}<br>${(o.lines||[]).map(x=>esc(x.title.slice(0,50))+(x.size?' ('+esc(x.size)+')':'')+' × '+x.qty).join(', ')}<br><b>${money(o.total)}</b> · UTR: <b>${esc(o.utr||'abhi nahi diya')}</b></p>
  <button class="btn s" data-a="st" data-id="${o.id}" data-v="Confirmed">Confirm</button> <button class="btn g s" data-a="st" data-id="${o.id}" data-v="Shipped">Shipped</button> <button class="btn g s" data-a="st" data-id="${o.id}" data-v="Delivered">Delivered</button> <button class="btn d s" data-a="st" data-id="${o.id}" data-v="Rejected">Reject</button> <button class="btn d s" data-a="delo" data-id="${o.id}">Delete</button>
  <details style="margin-top:10px"><summary><b>📍 Tracking update</b></summary><form class="trk" data-oid="${o.id}" style="margin-top:8px"><div class="f2"><label>Abhi location<input name="location" required value="${esc(t.location||'')}" placeholder="Jaise: Lucknow hub"></label><label>Courier<input name="courier" value="${esc(t.courier||'')}"></label><label>Tracking ID<input name="trackId" value="${esc(t.trackId||'')}"></label><label>Note<input name="note" placeholder="Jaise: Out for delivery"></label></div><button class="btn s">Tracking save</button></form></details></div>`}).join('')||'<p class="mut">Abhi koi order nahi.</p>'} else b.innerHTML=`<form class="panel" id="st"><h3>Store settings</h3><div class="f2"><label>Store naam<input name="storeName" value="${esc(settings.storeName)}"></label><label>UPI ID<input name="upiId" value="${esc(settings.upiId)}" placeholder="name@bank"></label></div><label>Apna UPI QR code image (khali = auto QR)<input name="qr" type="file" accept="image/*"></label>${settings.qr?`<img src="${settings.qr}" style="width:130px;display:block;margin-bottom:10px" alt="">`:''}<button class="btn">Save</button></form>`}

function render(){const h=location.hash.slice(1)||'home',[r,id]=h.split('/');cc();
 $('#app').innerHTML=r==='product'?product(id):r==='cart'?cartV():r==='checkout'?checkout():r==='pay'?pay():r==='orders'?'<h2>Meri Orders</h2><div id="mo"></div>':r==='login'?login():r==='admin'?admin():home();
 if(r==='orders')myOrders();if(r==='admin')loadAdmin()}

function addCart(id,go){const p=products.find(x=>x.id===id),s=$('#sz'),size=s?s.value:'';const l=cart.find(x=>x.id===id&&x.size===size);l?l.qty++:cart.push({id,size,qty:1});sv('cart',cart);cc();go?location.hash='#cart':toast('Cart mein add ho gaya')}
const fakeUtr=u=>!/^\d{12}$/.test(u)||/^(\d)\1{11}$/.test(u)||/^(\d{2})\1{5}$/.test(u)||/^(\d{3})\1{3}$/.test(u)||/^(\d{4})\1{2}$/.test(u)||/^(\d{6})\1$/.test(u)||'01234567890123456789'.includes(u)||'98765432109876543210'.includes(u);
const bad=m=>{const e=$('#ue');e?e.textContent='❌ '+m:alert(m);const f=$('#utr');if(f){f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}return false};
async function claim(oid,utr){if(fakeUtr(utr))return bad('UTR galat hai, reject kiya gaya. Apne UPI app se sahi 12 ank ka UTR dekhkar daalein.');
 try{const b=writeBatch(db);b.set(doc(db,'utrs',utr),{orderId:oid,uid:auth.currentUser.uid,at:Date.now()});b.update(doc(db,'orders',oid),{utr,paymentStatus:'Claimed',claimedAt:Date.now()});await b.commit();return true}
 catch(e){return bad('Ye UTR pehle use ho chuka hai ya galat hai, reject kiya gaya. Sahi UTR daalein.')}}

document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
 if(a==='open')location.hash='#product/'+id;
 else if(a==='add')addCart(id,false);else if(a==='buy')addCart(id,true);
 else if(a==='thumb'){$('#mp').src=curP.photos[t.dataset.i];document.querySelectorAll('.th img').forEach(x=>x.classList.toggle('on',x===t))}
 else if(a==='zoom'){const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${t.src}" alt="">`;z.onclick=()=>z.remove();document.body.appendChild(z)}
 else if(a==='qty'){const c=cart[t.dataset.i];c.qty=Math.max(1,c.qty+Number(t.dataset.d));sv('cart',cart);render()}
 else if(a==='rm'){cart.splice(t.dataset.i,1);sv('cart',cart);render()}
 else if(a==='tab'){tab=id;editId=null;render()}
 else if(a==='editp'){editId=id;drawEdit()}
 else if(a==='cancel'){editId=null;loadAdmin()}
 else if(a==='pdel'){editPh.splice(+t.dataset.i,1);drawPh()}
 else if(a==='pmain'){const[x]=editPh.splice(+t.dataset.i,1);editPh.unshift(x);drawPh()}
 else if(a==='odisc'){await updateDoc(doc(db,'products',id),{discount:Number($('#od-'+id).value||0)});toast('Offer save ho gaya')}
 else if(a==='seed'){const{id:_,...d}=SEED;await setDoc(doc(collection(db,'products')),{...d,createdAt:Date.now()});toast('Product save ho gaya')}
 else if(a==='logout'){await signOut(auth);location.hash='#home'}
 else if(a==='delp'){if(confirm('Product delete karein?')){await deleteDoc(doc(db,'products',id));loadAdmin()}}
 else if(a==='delo'){if(confirm('Order delete karein?')){await deleteDoc(doc(db,'orders',id));loadAdmin()}}
 else if(a==='st'){const v=t.dataset.v,u={status:v};if(v==='Confirmed'){const o=adminOrders.find(x=>x.id===id);if(o&&o.utr&&adminOrders.filter(x=>x.utr===o.utr).length>1&&!confirm('⚠ Ye UTR kai orders me hai. Phir bhi confirm karein?'))return;u.paymentStatus='Verified'}if(v==='Rejected')u.paymentStatus='Rejected';u.history=arrayUnion({note:'Status: '+v,at:Date.now()});await updateDoc(doc(db,'orders',id),u);toast('Status: '+v);loadAdmin()}});

document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,fd=new FormData(f),btn=f.querySelector('button');
 try{
 if(f.id==='login'){try{await signInWithEmailAndPassword(auth,fd.get('email'),fd.get('password'));location.hash='#admin'}catch(x){$('#le').textContent='Login nahi hua. Gmail ya password galat hai ('+(x.code||'')+')'}}
 else if(f.id==='co'){btn.disabled=true;if(!auth.currentUser)await signInAnonymously(auth);
  const lines=cart.map(c=>{const p=products.find(x=>x.id===c.id);return {productId:p.id,title:p.title,size:c.size,qty:c.qty,price:price(p),lineTotal:price(p)*c.qty}}),tt=lines.reduce((s,l)=>s+l.lineTotal,0),ref=doc(collection(db,'orders'));
  await setDoc(ref,{name:fd.get('name').trim(),phone:fd.get('phone'),pincode:fd.get('pincode'),city:fd.get('city').trim(),state:fd.get('state').trim(),address:fd.get('address').trim(),lines,total:tt,status:'Pending',paymentStatus:'Unpaid',uid:auth.currentUser.uid,createdAt:Date.now()});
  sv('last',{id:ref.id,short:ref.id.slice(-6).toUpperCase(),total:tt});cart=[];sv('cart',cart);location.hash='#pay'}
 else if(f.id==='utr'){const o=LS('last',null);if(await claim(o.id,String(fd.get('utr')).trim()))$('#app').innerHTML='<div class="panel pop" style="max-width:480px;margin:auto;text-align:center"><svg class="tick" viewBox="0 0 52 52" width="72" height="72"><circle cx="26" cy="26" r="24" fill="none" stroke="#16a34a" stroke-width="3"/><path d="M14 27l8 8 16-17" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><h3>UTR mil gaya</h3><p>Payment check hone me 24 ghante tak lag sakte hain. Order ka status aur tracking "Meri Orders" mein dikhega.</p><a class="btn" href="#orders">Meri Orders</a></div>'}
 else if(f.classList.contains('utr2')){if(await claim(f.dataset.oid,String(fd.get('utr')).trim())){toast('UTR save ho gaya');myOrders()}}
 else if(f.id==='pf'){btn.disabled=true;btn.textContent='Save ho raha hai...';const photos=[];for(const x of [...f.ph.files].slice(0,9))photos.push(await shrink(x,700,.6));
  await setDoc(doc(collection(db,'products')),{title:fd.get('title').trim(),price:Number(fd.get('price')),discount:Number(fd.get('discount')||0),sizes:String(fd.get('sizes')).split(',').map(x=>x.trim()).filter(Boolean),description:fd.get('description').trim(),photos,createdAt:Date.now()});toast('Product save ho gaya');loadAdmin()}
 else if(f.classList.contains('trk')){const t={location:fd.get('location').trim(),courier:fd.get('courier').trim(),trackId:fd.get('trackId').trim(),note:fd.get('note').trim(),updatedAt:Date.now()};await updateDoc(doc(db,'orders',f.dataset.oid),{tracking:t,history:arrayUnion({location:t.location,note:t.note,at:t.updatedAt})});toast('Tracking update ho gayi');loadAdmin()}
 else if(f.id==='ef'){btn.disabled=true;btn.textContent='Save ho raha hai...';const np=[];for(const x of [...f.ph.files])np.push(await shrink(x,700,.6));
  await updateDoc(doc(db,'products',editId),{title:fd.get('title').trim(),price:Number(fd.get('price')),discount:Number(fd.get('discount')||0),sizes:String(fd.get('sizes')).split(',').map(x=>x.trim()).filter(Boolean),description:fd.get('description').trim(),photos:editPh.concat(np).slice(0,9)});editId=null;toast('Badlav save ho gaya');loadAdmin()}
 else if(f.id==='of'){const n={banner:fd.get('banner').trim(),globalDiscount:Number(fd.get('globalDiscount')||0)};await setDoc(doc(db,'settings','main'),n,{merge:true});settings={...settings,...n};toast('Offer save ho gaya');loadAdmin()}
 else if(f.id==='st'){const qrf=f.qr.files[0];const n={storeName:fd.get('storeName'),upiId:fd.get('upiId').trim(),qr:qrf?await shrink(qrf,600,.9):(settings.qr||'')};
  await setDoc(doc(db,'settings','main'),n,{merge:true});settings={...settings,...n};$('#brand').textContent=settings.storeName;toast('Settings save ho gayi');loadAdmin()}
 }catch(err){alert('Error: '+err.message);if(btn)btn.disabled=false}});
</script></body></html>
